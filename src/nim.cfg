# NOTE: `--path: "../lib"` was removed here.
#
# nimony's src/lib mirrors the stdlib layout (system/, posix/, windows/), so
# with it on the search path classic Nim's implicit system.nim resolves
# `include "system/alloc"` to nimony's own alloc.nim -- nimony source, not Nim
# source -- and the build dies on `{.untyped.}`. Ordering does not rescue it:
# an explicit --path always beats the stdlib for an include.
#
# Every module here already reaches the library through an explicit relative
# import (`import ".." / lib / [...]`), so the entry bought nothing.
# Btw this relies on a Nim bug where it interprets the --outdir relative to the current directory
# instead of the directory of this nim.cfg file.
--outdir: "bin"
